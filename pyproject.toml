[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meka-filesystem"
version = "0.1.0"
description = "Authenticated remote MCP server for isolated filesystem projects"
readme = "README.md"
license = "MIT"
authors = [{ name = "Martín Osuna" }]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4,<4.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pymupdf>=1.24,<2.0",
    "pytesseract>=0.3,<1.0",
    "pillow>=10.0",
    "reportlab>=4.0,<6.0",
    "openpyxl>=3.1,<4.0",
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["workspace*"]

[project.scripts]
meka-filesystem-stdio = "workspace.servers.filesystem_stdio:main"
