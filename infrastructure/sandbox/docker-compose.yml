services:
  filesystem-mcp:
    build:
      context: ../..
      dockerfile: infrastructure/Dockerfile

    container_name: filesystem-mcp-sandbox-${PROJECT_NAME}

    restart: unless-stopped
    init: true
    user: "${MEKA_UID:-1000}:${MEKA_GID:-1000}"

    # Bound to loopback only: never reachable from the network, regardless
    # of firewall rules. This is what makes "modo jaula" safe by default.
    ports:
      - "127.0.0.1:${MEKA_PORT:-8787}:8000"

    environment:
      MEKA_WORKSPACE_ROOT: /data/workspace
      MEKA_AUTH_MODE: ${MEKA_AUTH_MODE:-api-key}
      MEKA_API_KEY: ${MEKA_API_KEY:-}

    volumes:
      - ${MEKA_WORKSPACE_PATH:?MEKA_WORKSPACE_PATH must point to the folder you want to isolate}:/data/workspace:rw

    security_opt:
      - no-new-privileges:true

# No external network here on purpose: this mode is standalone. No
# meka-network, no reverse proxy, no tunnel required. `docker compose up`
# is the whole setup.
